name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - user: actions/checkout@v4

      - user: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

build:
  runs-on: ubuntu-latest
  needs: test
  steps:
    - uses: actions/checkout@v4
    - run: docker build -t devops-project:ci .
    - name: Smoke test the container
      run: |
        docker run -d --name smoke -p 5000:5000 devops-project:ci
        sleep 5
        curl --fail localhost:5000/health
